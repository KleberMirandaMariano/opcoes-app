<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulador de Estratégias - B3</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    /* ===== VARIÁVEIS DE COR ===== */
    :root {
      --color-primary: #10B981;
      --color-danger: #EF4444;
      --color-bg-dark: #0F172A;
      --color-card-dark: #1E293B;
      --color-surface-dark: #334155;
      --color-border: rgba(255, 255, 255, 0.1);
      --color-text-primary: #F1F5F9;
      --color-text-secondary: #CBD5E1;
    }

    * { box-sizing: border-box; }

    html.dark { background-color: var(--color-bg-dark); color-scheme: dark; }

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--color-bg-dark);
      background-image: radial-gradient(circle at 20% 50%, rgba(16, 185, 129, 0.05) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.03) 0%, transparent 50%);
      color: var(--color-text-primary);
      min-height: max(884px, 100dvh);
      line-height: 1.6;
    }

    .primary { color: var(--color-primary); }
    .bg-primary { background-color: var(--color-primary); }
    .border-primary { border-color: var(--color-primary); }
    .text-primary { color: var(--color-primary); }

    .danger { color: var(--color-danger); }
    .text-danger { color: var(--color-danger); }

    .bg-background-dark { background-color: var(--color-bg-dark); }
    .bg-card-dark { background-color: var(--color-card-dark); }
    .bg-surface-dark { background-color: var(--color-surface-dark); }

    .glassmorphism { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }

    .card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(16, 185, 129, 0.1); border-radius: 12px; transition: all 0.3s ease; }
    .card:hover { background: rgba(30, 41, 59, 0.8); border-color: rgba(16, 185, 129, 0.3); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(16, 185, 129, 0.1); }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .grid-line { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
    .data-line { stroke: var(--color-primary); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .text-slate-500 { color: var(--color-text-secondary); }
    .text-slate-400 { color: rgba(203, 213, 225, 0.7); }
    .text-slate-300 { color: rgba(203, 213, 225, 0.9); }
    .text-slate-100 { color: var(--color-text-primary); }

    .border-white/5 { border-color: rgba(255, 255, 255, 0.05); }
    .border-white/10 { border-color: rgba(255, 255, 255, 0.1); }

    .bg-white/5 { background-color: rgba(255, 255, 255, 0.05); }
    .bg-white/10 { background-color: rgba(255, 255, 255, 0.1); }

    .backdrop-blur-2xl { backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
    .backdrop-blur-xl { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  </style>
  <style> body { font-family: 'Manrope', sans-serif; } .no-scrollbar::-webkit-scrollbar { display: none; } body { min-height: max(884px, 100dvh); } </style>
</head>
<body class="bg-background-dark text-white min-h-screen pb-32">
  <header class="sticky top-0 z-50 bg-background-dark/80 backdrop-blur-md border-b border-white/10">
    <div class="flex items-center justify-between p-4">
      <a href="ativos.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10"><span class="material-symbols-outlined">arrow_back_ios_new</span></a>
      <div class="text-center">
        <h1 class="text-sm font-bold tracking-tight uppercase opacity-60">Simulador</h1>
        <div class="flex items-center justify-center gap-1">
          <span id="sim-ticker" class="text-lg font-extrabold">PETR4</span>
          <span id="sim-price" class="text-xs font-bold px-1.5 py-0.5 rounded bg-primary text-black">--</span>
        </div>
      </div>
      <button class="w-10 h-10 rounded-full hover:bg-white/10"><span class="material-symbols-outlined">search</span></button>
    </div>
    <div class="flex overflow-x-auto no-scrollbar gap-3 px-4 pb-4">
      <button type="button" class="strategy-btn whitespace-nowrap px-4 py-2 rounded-full bg-primary text-background-dark font-bold text-sm" data-strategy="bull_call_spread">Bull Call Spread</button>
      <button type="button" class="strategy-btn whitespace-nowrap px-4 py-2 rounded-full bg-white/10 text-slate-300 font-bold text-sm" data-strategy="iron_condor">Iron Condor</button>
      <button type="button" class="strategy-btn whitespace-nowrap px-4 py-2 rounded-full bg-white/10 text-slate-300 font-bold text-sm" data-strategy="straddle">Straddle</button>
      <button type="button" class="strategy-btn whitespace-nowrap px-4 py-2 rounded-full bg-white/10 text-slate-300 font-bold text-sm" data-strategy="butterfly">Butterfly</button>
    </div>
  </header>
  <main class="p-4 space-y-6">
    <section class="bg-white/5 rounded-xl p-4 border border-white/10">
      <div class="flex justify-between items-end mb-4">
        <div>
          <p class="text-xs font-bold opacity-60 uppercase">Payoff no Vencimento</p>
          <p id="payoff-value" class="text-2xl font-black text-primary">--</p>
        </div>
        <div class="text-right">
          <p class="text-[10px] font-bold opacity-40 uppercase">Vencimento</p>
          <p id="payoff-exp" class="text-sm font-bold">--</p>
        </div>
      </div>
      <div class="relative h-48 w-full mt-2">
        <svg class="w-full h-full" viewBox="0 0 400 200" id="payoff-svg"></svg>
      </div>
      <div class="flex justify-between text-[10px] font-bold opacity-40 mt-2" id="payoff-labels"></div>
    </section>
    <section class="grid grid-cols-3 gap-3">
      <div class="bg-white/5 p-3 rounded-lg border border-white/10">
        <p class="text-[10px] font-bold opacity-60 uppercase mb-1">Lucro Máx</p>
        <p id="max-profit" class="text-sm font-black text-primary">--</p>
      </div>
      <div class="bg-white/5 p-3 rounded-lg border border-white/10">
        <p class="text-[10px] font-bold opacity-60 uppercase mb-1">Prej Máx</p>
        <p id="max-loss" class="text-sm font-black text-red-500">--</p>
      </div>
      <div class="bg-white/5 p-3 rounded-lg border border-white/10">
        <p class="text-[10px] font-bold opacity-60 uppercase mb-1">Breakeven</p>
        <p id="breakeven" class="text-sm font-black">--</p>
      </div>
    </section>
    <section class="space-y-4">
      <h3 class="text-sm font-extrabold uppercase tracking-widest opacity-60">Pernas da Estratégia</h3>
      <div id="legs-container" class="space-y-4"></div>
    </section>
  </main>
  <footer class="fixed bottom-0 left-0 right-0 p-4 bg-background-dark/90 backdrop-blur-xl border-t border-white/10 pb-8">
    <div class="max-w-md mx-auto flex items-center gap-4">
      <div class="flex-1">
        <p class="text-[10px] font-bold opacity-40 uppercase">Custo Estimado</p>
        <p id="cost-estimate" class="text-lg font-black">--</p>
      </div>
      <a href="boleta.html" class="flex-[2] bg-primary hover:bg-primary/90 text-background-dark font-black py-4 rounded-xl shadow-xl text-center block">ENVIAR ORDEM</a>
    </div>
  </footer>
  <div id="nav-placeholder"></div>
  <script src="js/api.js"></script>

</body>
</html>
