<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulador de Estratégias - B3</title>
  <script>
    tailwind.config = { darkMode: "class", theme: { extend: { colors: { primary: "#13ec6a", "background-dark": "#102217" }, fontFamily: { display: ["Manrope", "sans-serif"] } } } }
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style> body { font-family: 'Manrope', sans-serif; } .no-scrollbar::-webkit-scrollbar { display: none; } body { min-height: max(884px, 100dvh); } </style>
</head>
<body class="bg-background-dark text-white min-h-screen pb-32">
  <header class="sticky top-0 z-50 bg-background-dark/80 backdrop-blur-md border-b border-white/10">
    <div class="flex items-center justify-between p-4">
      <a href="ativos.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10"><span class="material-symbols-outlined">arrow_back_ios_new</span></a>
      <div class="text-center">
        <h1 class="text-sm font-bold tracking-tight uppercase opacity-60">Simulador</h1>
        <div class="flex items-center justify-center gap-1">
          <span id="sim-ticker" class="text-lg font-extrabold">PETR4</span>
          <span id="sim-price" class="text-xs font-bold px-1.5 py-0.5 rounded bg-primary text-black">--</span>
        </div>
      </div>
      <button class="w-10 h-10 rounded-full hover:bg-white/10"><span class="material-symbols-outlined">search</span></button>
    </div>
    <div class="flex overflow-x-auto no-scrollbar gap-3 px-4 pb-4">
      <button type="button" class="strategy-btn whitespace-nowrap px-4 py-2 rounded-full bg-primary text-background-dark font-bold text-sm" data-strategy="bull_call_spread">Bull Call Spread</button>
      <button type="button" class="strategy-btn whitespace-nowrap px-4 py-2 rounded-full bg-white/10 text-slate-300 font-bold text-sm" data-strategy="iron_condor">Iron Condor</button>
      <button type="button" class="strategy-btn whitespace-nowrap px-4 py-2 rounded-full bg-white/10 text-slate-300 font-bold text-sm" data-strategy="straddle">Straddle</button>
      <button type="button" class="strategy-btn whitespace-nowrap px-4 py-2 rounded-full bg-white/10 text-slate-300 font-bold text-sm" data-strategy="butterfly">Butterfly</button>
    </div>
  </header>
  <main class="p-4 space-y-6">
    <section class="bg-white/5 rounded-xl p-4 border border-white/10">
      <div class="flex justify-between items-end mb-4">
        <div>
          <p class="text-xs font-bold opacity-60 uppercase">Payoff no Vencimento</p>
          <p id="payoff-value" class="text-2xl font-black text-primary">--</p>
        </div>
        <div class="text-right">
          <p class="text-[10px] font-bold opacity-40 uppercase">Vencimento</p>
          <p id="payoff-exp" class="text-sm font-bold">--</p>
        </div>
      </div>
      <div class="relative h-48 w-full mt-2">
        <svg class="w-full h-full" viewBox="0 0 400 200" id="payoff-svg"></svg>
      </div>
      <div class="flex justify-between text-[10px] font-bold opacity-40 mt-2" id="payoff-labels"></div>
    </section>
    <section class="grid grid-cols-3 gap-3">
      <div class="bg-white/5 p-3 rounded-lg border border-white/10">
        <p class="text-[10px] font-bold opacity-60 uppercase mb-1">Lucro Máx</p>
        <p id="max-profit" class="text-sm font-black text-primary">--</p>
      </div>
      <div class="bg-white/5 p-3 rounded-lg border border-white/10">
        <p class="text-[10px] font-bold opacity-60 uppercase mb-1">Prej Máx</p>
        <p id="max-loss" class="text-sm font-black text-red-500">--</p>
      </div>
      <div class="bg-white/5 p-3 rounded-lg border border-white/10">
        <p class="text-[10px] font-bold opacity-60 uppercase mb-1">Breakeven</p>
        <p id="breakeven" class="text-sm font-black">--</p>
      </div>
    </section>
    <section class="space-y-4">
      <h3 class="text-sm font-extrabold uppercase tracking-widest opacity-60">Pernas da Estratégia</h3>
      <div id="legs-container" class="space-y-4"></div>
    </section>
  </main>
  <footer class="fixed bottom-0 left-0 right-0 p-4 bg-background-dark/90 backdrop-blur-xl border-t border-white/10 pb-8">
    <div class="max-w-md mx-auto flex items-center gap-4">
      <div class="flex-1">
        <p class="text-[10px] font-bold opacity-40 uppercase">Custo Estimado</p>
        <p id="cost-estimate" class="text-lg font-black">--</p>
      </div>
      <a href="boleta.html" class="flex-[2] bg-primary hover:bg-primary/90 text-background-dark font-black py-4 rounded-xl shadow-xl text-center block">ENVIAR ORDEM</a>
    </div>
  </footer>
  <div id="nav-placeholder"></div>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('nav-placeholder').innerHTML = nav();
    const q = getQuery();
    const ticker = (q.ticker || 'PETR4').toUpperCase();
    document.getElementById('sim-ticker').textContent = ticker;

    async function loadStock() {
      try {
        const r = await api('/api/stocks/' + ticker);
        document.getElementById('sim-price').textContent = 'R$ ' + Number(r.data.price).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
      } catch (e) {
        document.getElementById('sim-price').textContent = 'R$ 38,45';
      }
    }
    loadStock();

    async function loadPayoff(strategy) {
      try {
        const r = await api('/api/strategies/payoff?strategy=' + (strategy || 'bull_call_spread') + '&ticker=' + ticker);
        const d = r.data;
        document.getElementById('payoff-value').textContent = '+ R$ ' + (d.payoffAtExpiry || d.maxProfit || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
        document.getElementById('payoff-exp').textContent = '18 Out (22d)';
        document.getElementById('max-profit').textContent = 'R$ ' + (d.maxProfit || 0).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        document.getElementById('max-loss').textContent = 'R$ ' + (d.maxLoss || 0).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        document.getElementById('breakeven').textContent = 'R$ ' + (d.breakeven || 0).toFixed(2);
        document.getElementById('cost-estimate').textContent = 'R$ ' + (d.cost || 900).toLocaleString('pt-BR', { minimumFractionDigits: 2 });

        const pts = d.points || [[32, -900], [35, -900], [39.2, 0], [41, 2550], [45, 2550]];
        const xs = pts.map(p => 50 + (p[0] - 32) / (45 - 32) * 300);
        const ys = pts.map(p => 120 - (p[1] + 900) / 3450 * 100);
        let pathD = 'M ' + xs[0] + ' ' + ys[0];
        for (let i = 1; i < pts.length; i++) pathD += ' L ' + xs[i] + ' ' + ys[i];
        document.getElementById('payoff-svg').innerHTML = `
          <line class="opacity-10" stroke="currentColor" stroke-dasharray="4" x1="0" x2="400" y1="100" y2="100"/>
          <path d="${pathD}" fill="none" stroke="#13ec6a" stroke-linejoin="round" stroke-width="4"/>
          <circle cx="${xs[2]}" cy="${ys[2]}" fill="#13ec6a" r="5"/>
        `;
        document.getElementById('payoff-labels').innerHTML = pts.map((p, i) => i === 2 ? '<span class="text-primary opacity-100">' + p[0] + ' BE</span>' : '<span>' + p[0] + '</span>').join('');
      } catch (e) {
        document.getElementById('payoff-value').textContent = '+ R$ 1.250,00';
        document.getElementById('max-profit').textContent = 'R$ 2.4k';
        document.getElementById('max-loss').textContent = 'R$ 1.1k';
        document.getElementById('breakeven').textContent = 'R$ 39,20';
        document.getElementById('cost-estimate').textContent = 'R$ 900,00';
      }
    }

    document.querySelectorAll('.strategy-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.strategy-btn').forEach(b => { b.classList.remove('bg-primary', 'text-background-dark'); b.classList.add('bg-white/10', 'text-slate-300'); });
        btn.classList.add('bg-primary', 'text-background-dark'); btn.classList.remove('bg-white/10', 'text-slate-300');
        loadPayoff(btn.dataset.strategy);
      };
    });

    document.getElementById('legs-container').innerHTML = `
      <div class="bg-white/5 rounded-xl border border-white/10 overflow-hidden">
        <div class="p-4 border-b border-white/5 flex justify-between items-center">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-primary/20 flex items-center justify-center text-primary font-black text-sm uppercase">C</div>
            <div>
              <p class="text-sm font-black">PETRK380</p>
              <p class="text-[10px] font-bold opacity-40 uppercase">Call • Strike 38,00</p>
            </div>
          </div>
          <div class="text-right">
            <p class="text-xs font-bold">R$ 1,45</p>
            <p class="text-[10px] font-bold text-primary">+2.4%</p>
          </div>
        </div>
      </div>
      <div class="bg-white/5 rounded-xl border border-white/10 overflow-hidden">
        <div class="p-4 border-b border-white/5 flex justify-between items-center">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-red-500/20 flex items-center justify-center text-red-500 font-black text-sm uppercase">C</div>
            <div>
              <p class="text-sm font-black">PETRK410</p>
              <p class="text-[10px] font-bold opacity-40 uppercase">Call • Strike 41,00</p>
            </div>
          </div>
          <div class="text-right">
            <p class="text-xs font-bold">R$ 0,55</p>
            <p class="text-[10px] font-bold text-red-500">-1.2%</p>
          </div>
        </div>
      </div>
    `;
    loadPayoff('bull_call_spread');
  </script>
</body>
</html>
