<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grade de Opções</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    /* ===== VARIÁVEIS DE COR ===== */
    :root {
      --color-primary: #10B981;
      --color-danger: #EF4444;
      --color-bg-dark: #0F172A;
      --color-card-dark: #1E293B;
      --color-surface-dark: #334155;
      --color-border: rgba(255, 255, 255, 0.1);
      --color-text-primary: #F1F5F9;
      --color-text-secondary: #CBD5E1;
    }

    * { box-sizing: border-box; }

    html.dark { background-color: var(--color-bg-dark); color-scheme: dark; }

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--color-bg-dark);
      background-image: radial-gradient(circle at 20% 50%, rgba(16, 185, 129, 0.05) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.03) 0%, transparent 50%);
      color: var(--color-text-primary);
      min-height: max(884px, 100dvh);
      line-height: 1.6;
    }

    .primary { color: var(--color-primary); }
    .bg-primary { background-color: var(--color-primary); }
    .border-primary { border-color: var(--color-primary); }
    .text-primary { color: var(--color-primary); }

    .danger { color: var(--color-danger); }
    .text-danger { color: var(--color-danger); }

    .bg-background-dark { background-color: var(--color-bg-dark); }
    .bg-card-dark { background-color: var(--color-card-dark); }
    .bg-surface-dark { background-color: var(--color-surface-dark); }

    .glassmorphism { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }

    .card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(16, 185, 129, 0.1); border-radius: 12px; transition: all 0.3s ease; }
    .card:hover { background: rgba(30, 41, 59, 0.8); border-color: rgba(16, 185, 129, 0.3); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(16, 185, 129, 0.1); }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .grid-line { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
    .data-line { stroke: var(--color-primary); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .text-slate-500 { color: var(--color-text-secondary); }
    .text-slate-400 { color: rgba(203, 213, 225, 0.7); }
    .text-slate-300 { color: rgba(203, 213, 225, 0.9); }
    .text-slate-100 { color: var(--color-text-primary); }

    .border-white/5 { border-color: rgba(255, 255, 255, 0.05); }
    .border-white/10 { border-color: rgba(255, 255, 255, 0.1); }

    .bg-white/5 { background-color: rgba(255, 255, 255, 0.05); }
    .bg-white/10 { background-color: rgba(255, 255, 255, 0.1); }

    .backdrop-blur-2xl { backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
    .backdrop-blur-xl { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  </style>
  <style>
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    body { min-height: max(884px, 100dvh); }
  </style>
</head>
<body class="bg-background-dark font-display text-white antialiased">
  <div class="relative flex min-h-screen w-full flex-col overflow-hidden max-w-md mx-auto border-x border-white/10 pb-24">
    <header class="bg-background-dark border-b border-white/10 z-20">
      <div class="flex items-center p-4 pb-2 justify-between">
        <a href="ativo.html?ticker=TICKER_PLACEHOLDER" class="flex size-10 shrink-0 items-center justify-start">
          <span class="material-symbols-outlined cursor-pointer">arrow_back_ios</span>
        </a>
        <div class="flex-1 text-center">
          <h1 id="header-ticker" class="text-lg font-extrabold leading-tight tracking-tight">--</h1>
          <p id="header-price" class="text-primary text-sm font-bold">--</p>
        </div>
        <button class="flex w-10 items-center justify-end h-10 w-10"><span class="material-symbols-outlined">search</span></button>
      </div>
      <div class="px-4 py-3">
        <select id="expiration" class="w-full appearance-none rounded-lg text-white border border-white/20 bg-white/5 focus:ring-1 focus:ring-primary h-12 pl-4 pr-10 text-sm font-semibold tracking-wide cursor-pointer outline-none">
          <!-- preenchido via API -->
        </select>
      </div>
      <div class="grid grid-cols-7 text-[9px] uppercase font-bold text-white/40 bg-white/5 py-1.5 px-2 text-center border-b border-white/10">
        <div class="col-span-1">Últ.</div>
        <div class="col-span-1">Var%</div>
        <div class="col-span-1">Vol.</div>
        <div class="col-span-1 text-white border-x border-white/10">Strike</div>
        <div class="col-span-1">Vol.</div>
        <div class="col-span-1">Var%</div>
        <div class="col-span-1">Últ.</div>
      </div>
    </header>
    <main class="flex-1 overflow-y-auto hide-scrollbar" id="chain-container">
      <p class="p-4 text-slate-500">Carregando grade...</p>
    </main>
    <footer class="bg-background-dark border-t border-white/10 p-3 flex gap-2 overflow-x-auto hide-scrollbar">
      <button class="flex h-9 shrink-0 items-center justify-center rounded-full bg-primary px-5 text-background-dark text-xs font-bold">Todos</button>
      <button class="flex h-9 shrink-0 items-center justify-center rounded-full bg-white/10 px-5 text-white text-xs font-semibold">ITM</button>
      <button class="flex h-9 shrink-0 items-center justify-center rounded-full bg-white/10 px-5 text-white text-xs font-semibold">OTM</button>
    </footer>
  </div>
  <div id="nav-placeholder"></div>
  <script src="js/api.js"></script>

  </style>
</body>
</html>
