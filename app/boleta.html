<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Boleta de Negociação</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = { darkMode: "class", theme: { extend: { colors: { primary: "#137fec", success: "#00c087", danger: "#f6465d", "background-dark": "#0b0e11", "surface-dark": "#181a20", "surface-accent": "#2b2f36", "border-dark": "#3b4754" }, fontFamily: { display: ["Manrope", "sans-serif"] } } } }
  </script>
  <style>
    body { font-family: 'Manrope', sans-serif; }
    .buy-selected:checked + span { background-color: #00c087; color: white; box-shadow: 0 4px 14px 0 rgba(0, 192, 135, 0.3); }
    .sell-selected:checked + span { background-color: #f6465d; color: white; box-shadow: 0 4px 14px 0 rgba(246, 70, 93, 0.3); }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    body { min-height: max(884px, 100dvh); }
  </style>
</head>
<body class="bg-background-dark text-white antialiased font-display pb-24">
  <div class="max-w-md mx-auto border-x border-border-dark/30">
    <header class="flex items-center justify-between px-4 py-4 bg-background-dark border-b border-border-dark/30">
      <a href="ativos.html" class="flex items-center justify-center size-10 rounded-full hover:bg-white/5 transition-colors"><span class="material-symbols-outlined">close</span></a>
      <h1 class="text-lg font-bold tracking-tight">Boleta de Negociação</h1>
      <button class="flex items-center justify-center size-10 rounded-full hover:bg-white/5 transition-colors"><span class="material-symbols-outlined text-success">signal_cellular_alt</span></button>
    </header>
    <main class="p-4 space-y-6">
      <section id="asset-info" class="flex items-center justify-between bg-surface-dark p-4 rounded-2xl border border-border-dark/30">
        <div class="flex items-center gap-3">
          <div class="size-12 rounded-xl bg-surface-accent flex items-center justify-center font-bold text-sm">--</div>
          <div>
            <h2 id="boleta-ticker" class="text-xl font-bold leading-none mb-1">--</h2>
            <p id="boleta-name" class="text-xs text-slate-400 font-medium">--</p>
          </div>
        </div>
        <div class="text-right">
          <p id="boleta-price" class="text-xl font-bold leading-none mb-1">--</p>
          <p id="boleta-change" class="text-sm font-bold text-success">--</p>
        </div>
      </section>
      <div class="flex p-1 bg-surface-dark rounded-2xl border border-border-dark/30">
        <label class="relative flex-1 cursor-pointer">
          <input checked class="peer sr-only buy-selected" name="side" type="radio" value="compra"/>
          <span class="flex items-center justify-center h-12 rounded-xl text-sm font-extrabold transition-all duration-300 text-slate-500 uppercase tracking-widest peer-checked:bg-success peer-checked:text-white">COMPRA</span>
        </label>
        <label class="relative flex-1 cursor-pointer">
          <input class="peer sr-only sell-selected" name="side" type="radio" value="venda"/>
          <span class="flex items-center justify-center h-12 rounded-xl text-sm font-extrabold transition-all duration-300 text-slate-500 uppercase tracking-widest peer-checked:bg-danger peer-checked:text-white">VENDA</span>
        </label>
      </div>
      <div class="space-y-5">
        <div class="space-y-2">
          <label class="text-xs font-bold text-slate-400 ml-1 uppercase tracking-wider">Tipo de Ordem</label>
          <select id="order-type" class="w-full h-14 bg-surface-dark border border-border-dark/50 rounded-2xl px-4 appearance-none focus:ring-2 focus:ring-primary/50 text-white font-semibold">
            <option>Limitada</option>
            <option>A Mercado</option>
            <option>Stop Loss</option>
            <option>Stop Móvel</option>
          </select>
        </div>
        <div class="space-y-2">
          <label class="text-xs font-bold text-slate-400 ml-1 uppercase tracking-wider">Quantidade</label>
          <div class="flex h-14 bg-surface-dark border border-border-dark/50 rounded-2xl overflow-hidden focus-within:ring-2 focus-within:ring-primary/50">
            <button type="button" class="qty-minus w-16 flex items-center justify-center hover:bg-white/10 border-r border-border-dark/30"><span class="material-symbols-outlined">remove</span></button>
            <input id="qty" class="flex-1 bg-transparent border-none text-center font-bold text-xl text-white" type="number" value="100" min="1"/>
            <button type="button" class="qty-plus w-16 flex items-center justify-center hover:bg-white/10 border-l border-border-dark/30"><span class="material-symbols-outlined">add</span></button>
          </div>
          <div class="flex gap-2 pt-1 overflow-x-auto">
            <button type="button" class="qty-btn px-4 py-2 rounded-xl bg-surface-dark border border-border-dark/30 text-xs font-bold text-slate-300" data-qty="100">100</button>
            <button type="button" class="qty-btn px-4 py-2 rounded-xl bg-surface-dark border border-border-dark/30 text-xs font-bold text-slate-300" data-qty="500">500</button>
            <button type="button" class="qty-btn px-4 py-2 rounded-xl bg-surface-dark border border-border-dark/30 text-xs font-bold text-slate-300" data-qty="1000">1k</button>
          </div>
        </div>
        <div class="space-y-2">
          <label class="text-xs font-bold text-slate-400 ml-1 uppercase tracking-wider">Preço (R$)</label>
          <div class="flex h-14 bg-surface-dark border border-border-dark/50 rounded-2xl overflow-hidden focus-within:ring-2 focus-within:ring-primary/50">
            <button type="button" class="price-minus w-16 flex items-center justify-center hover:bg-white/10 border-r border-border-dark/30"><span class="material-symbols-outlined">remove</span></button>
            <input id="price" class="flex-1 bg-transparent border-none text-center font-bold text-xl text-white" type="text" value="34,50"/>
            <button type="button" class="price-plus w-16 flex items-center justify-center hover:bg-white/10 border-l border-border-dark/30"><span class="material-symbols-outlined">add</span></button>
          </div>
        </div>
      </div>
      <div class="p-5 bg-surface-dark rounded-2xl border border-border-dark/50 space-y-4">
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-400 font-medium">Saldo Disponível</span>
          <span id="balance" class="font-bold text-slate-200">--</span>
        </div>
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-400 font-medium">Corretagem Estimada</span>
          <span class="font-bold text-success bg-success/10 px-2 py-0.5 rounded text-xs">GRÁTIS</span>
        </div>
        <div class="pt-4 border-t border-border-dark/30 flex justify-between items-end">
          <div class="flex flex-col">
            <span class="text-[10px] font-bold text-slate-500 uppercase">Total Estimado</span>
          </div>
          <span id="total" class="text-2xl font-black text-white">--</span>
        </div>
      </div>
      <div class="flex items-center gap-3 py-2">
        <label class="flex items-center gap-3 cursor-pointer">
          <input id="daytrade" type="checkbox" class="sr-only peer"/>
          <div class="w-11 h-6 bg-surface-accent rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-success relative inline-block"></div>
          <span class="text-xs font-extrabold text-slate-400 uppercase tracking-wider">Day Trade</span>
        </label>
      </div>
    </main>
    <footer class="p-4 pb-10 bg-background-dark/80 border-t border-border-dark/50 backdrop-blur-xl">
      <button id="btn-enviar" class="w-full h-14 bg-success hover:brightness-110 active:scale-[0.98] text-white font-black text-lg rounded-2xl shadow-xl flex items-center justify-center gap-3">
        <span>REVISAR E ENVIAR</span>
        <span class="material-symbols-outlined font-bold">arrow_forward</span>
      </button>
      <p class="text-[10px] text-center text-slate-500 mt-4 uppercase tracking-[0.15em] font-bold">Bolsa de Valores B3 • Simulação</p>
    </footer>
  </div>
  <div id="nav-placeholder"></div>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('nav-placeholder').innerHTML = nav();
    const q = getQuery();
    const ticker = (q.ticker || 'PETR4').toUpperCase();

    function updateTotal() {
      const qty = parseInt(document.getElementById('qty').value, 10) || 0;
      const priceStr = (document.getElementById('price').value || '0').replace(',', '.');
      const price = parseFloat(priceStr) || 0;
      const total = qty * price;
      document.getElementById('total').textContent = 'R$ ' + total.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    async function load() {
      try {
        const [stockRes, balanceRes] = await Promise.all([
          api('/api/stocks/' + ticker).catch(() => ({ data: { ticker, name: ticker, price: 34.50, change: 1.24 } })),
          api('/api/orders/balance')
        ]);
        const s = stockRes.data;
        document.getElementById('boleta-ticker').textContent = s.ticker;
        document.getElementById('boleta-name').textContent = s.name || s.ticker;
        document.getElementById('boleta-price').textContent = 'R$ ' + Number(s.price).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        document.getElementById('boleta-change').innerHTML = (s.change >= 0 ? '+' : '') + s.change + '%';
        document.getElementById('price').value = String(s.price).replace('.', ',');
        document.getElementById('balance').textContent = 'R$ ' + Number(balanceRes.data.saldoDisponivel || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        updateTotal();
      } catch (e) {
        document.getElementById('boleta-ticker').textContent = ticker;
        document.getElementById('balance').textContent = 'R$ 0,00';
        updateTotal();
      }

      document.getElementById('qty').oninput = updateTotal;
      document.getElementById('price').oninput = updateTotal;
      document.querySelectorAll('.qty-btn').forEach(btn => {
        btn.onclick = () => { document.getElementById('qty').value = btn.dataset.qty; updateTotal(); };
      });
      document.querySelector('.qty-minus').onclick = () => { const el = document.getElementById('qty'); el.value = Math.max(1, parseInt(el.value, 10) - 100); updateTotal(); };
      document.querySelector('.qty-plus').onclick = () => { const el = document.getElementById('qty'); el.value = (parseInt(el.value, 10) || 0) + 100; updateTotal(); };
      const priceEl = document.getElementById('price');
      document.querySelector('.price-minus').onclick = () => { const v = parseFloat(priceEl.value.replace(',', '.')) - 0.01; priceEl.value = v.toFixed(2).replace('.', ','); updateTotal(); };
      document.querySelector('.price-plus').onclick = () => { const v = parseFloat(priceEl.value.replace(',', '.')) + 0.01; priceEl.value = v.toFixed(2).replace('.', ','); updateTotal(); };

      document.getElementById('btn-enviar').onclick = async () => {
        const side = document.querySelector('input[name="side"]:checked').value;
        const quantity = parseInt(document.getElementById('qty').value, 10) || 100;
        const price = document.getElementById('price').value.replace(',', '.');
        const dayTrade = document.getElementById('daytrade').checked;
        try {
          const res = await api('/api/orders', { method: 'POST', body: JSON.stringify({ ticker, side, type: document.getElementById('order-type').value, quantity, price: price.replace(',', '.'), dayTrade }) });
          alert('Ordem simulada enviada! Total: R$ ' + res.data.total.toFixed(2));
          const bal = await api('/api/orders/balance');
          document.getElementById('balance').textContent = 'R$ ' + Number(bal.data.saldoDisponivel).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        } catch (err) {
          alert('Erro: ' + (err.message || 'Não foi possível enviar a ordem.'));
        }
      };
    }
    load();
  </script>
</body>
</html>
