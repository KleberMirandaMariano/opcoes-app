<!DOCTYPE html>
<html class="dark" lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ativos - Mercado B3</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = { darkMode: "class", theme: { extend: { colors: { primary: "#00FF7F", "background-dark": "#121212", "card-dark": "#1C1C1E", "surface-dark": "#2C2C2E" }, fontFamily: { display: ["Manrope", "sans-serif"] } } } };
  </script>
  <style> body { font-family: 'Manrope', sans-serif; } body { min-height: max(884px, 100dvh); } </style>
</head>
<body class="bg-background-dark text-slate-100 min-h-screen pb-24">
  <header class="sticky top-0 z-50 bg-background-dark/90 backdrop-blur-xl px-4 py-4 flex items-center justify-between border-b border-white/5">
    <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/5">
      <span class="material-symbols-outlined">arrow_back_ios</span>
    </a>
    <h1 class="text-lg font-bold tracking-tight">Ativos</h1>
    <div class="w-10"></div>
  </header>
  <main class="max-w-md mx-auto p-4 space-y-3">
    <p class="text-slate-400 text-sm">Toque em um ativo para ver detalhes, grade de opções ou abrir boleta.</p>
    <div class="flex gap-3 mb-4">
      <a href="simulador.html" class="flex-1 bg-card-dark border border-white/10 rounded-xl p-4 text-center hover:bg-white/5">
        <span class="material-symbols-outlined text-primary text-2xl block mb-1">show_chart</span>
        <span class="text-xs font-bold text-slate-300">Simulador</span>
      </a>
      <a href="backtest.html" class="flex-1 bg-card-dark border border-white/10 rounded-xl p-4 text-center hover:bg-white/5">
        <span class="material-symbols-outlined text-primary text-2xl block mb-1">trending_up</span>
        <span class="text-xs font-bold text-slate-300">Backtest</span>
      </a>
    </div>
    <div id="ativos-list" class="space-y-2"></div>
  </main>
  <div id="nav-placeholder"></div>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('nav-placeholder').innerHTML = nav();
    const q = getQuery();
    const fmt = (n) => Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    async function load() {
      try {
        const r = await api('/api/market/stocks?filter=altas');
        const list = r.data || [];
        const all = [...list, { ticker: 'PETR4', name: 'Petrobras PN', sector: 'Petróleo', price: 38.50, change: 1.24 }, { ticker: 'VALE3', name: 'Vale ON', sector: 'Mineração', price: 67.80, change: 2.10 }, { ticker: 'ITUB4', name: 'Itaú Unibanco', sector: 'Bancos', price: 34.22, change: 1.85 }];
        const uniq = [];
        const seen = new Set();
        all.forEach(s => { if (!seen.has(s.ticker)) { seen.add(s.ticker); uniq.push(s); } });
        document.getElementById('ativos-list').innerHTML = uniq.map(s => `
          <div class="bg-card-dark border border-white/5 rounded-xl overflow-hidden">
            <a href="ativo.html?ticker=${s.ticker}" class="flex items-center justify-between p-4 hover:bg-white/5 block">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-lg bg-surface-dark flex items-center justify-center font-bold text-xs border border-white/10">${s.ticker}</div>
                <div>
                  <p class="font-bold">${s.name}</p>
                  <p class="text-xs text-slate-500">${s.sector}</p>
                </div>
              </div>
              <div class="text-right">
                <p class="font-bold">R$ ${fmt(s.price)}</p>
                <p class="text-xs ${s.change >= 0 ? 'text-primary' : 'text-red-400'}">${(s.change >= 0 ? '+' : '') + s.change.toFixed(2)}%</p>
              </div>
            </a>
            <div class="flex border-t border-white/5">
              <a href="ativo.html?ticker=${s.ticker}" class="flex-1 text-center py-2 text-xs font-bold text-slate-400 hover:bg-white/5">Detalhes</a>
              <a href="opcoes.html?ticker=${s.ticker}" class="flex-1 text-center py-2 text-xs font-bold text-slate-400 hover:bg-white/5 border-x border-white/5">Opções</a>
              <a href="boleta.html?ticker=${s.ticker}" class="flex-1 text-center py-2 text-xs font-bold text-slate-400 hover:bg-white/5">Boleta</a>
            </div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('ativos-list').innerHTML = '<p class="text-slate-500 p-4">Erro ao carregar. Inicie o servidor backend.</p>';
      }
    }
    load();
  </script>
</body>
</html>
