<!DOCTYPE html>
<html class="dark" lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carteira - Mercado B3</title>
  <script>
    tailwind.config = { darkMode: "class", theme: { extend: { colors: { primary: "#00FF7F", "background-dark": "#121212", "card-dark": "#1C1C1E" }, fontFamily: { display: ["Manrope", "sans-serif"] } } } }
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body class="bg-background-dark text-slate-100 min-h-screen pb-24">
  <header class="sticky top-0 z-50 bg-background-dark/90 backdrop-blur-xl px-4 py-4 flex items-center justify-between border-b border-white/5">
    <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/5"><span class="material-symbols-outlined">arrow_back_ios</span></a>
    <h1 class="text-lg font-bold tracking-tight">Carteira</h1>
    <div class="w-10"></div>
  </header>
  <main class="max-w-md mx-auto p-4">
    <p class="text-slate-500 text-sm">Resumo da carteira e ordens simuladas. Use a Boleta para enviar ordens.</p>
    <div class="mt-4 bg-card-dark rounded-xl p-4 border border-white/5">
      <p class="text-xs text-slate-400 uppercase font-bold mb-2">Saldo disponível</p>
      <p id="wallet-balance" class="text-2xl font-bold text-primary">--</p>
    </div>
    <div class="mt-4">
      <p class="text-xs text-slate-400 uppercase font-bold mb-2">Últimas ordens (simuladas)</p>
      <div id="orders-list" class="space-y-2"></div>
    </div>
  </main>
  <div id="nav-placeholder"></div>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('nav-placeholder').innerHTML = nav();
    async function load() {
      try {
        const [bal, orders] = await Promise.all([ api('/api/orders/balance'), api('/api/orders') ]);
        document.getElementById('wallet-balance').textContent = 'R$ ' + Number(bal.data.saldoDisponivel).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
        const list = (orders.data || []).slice(-10).reverse();
        document.getElementById('orders-list').innerHTML = list.length ? list.map(o => `
          <div class="bg-card-dark/50 rounded-lg p-3 border border-white/5 flex justify-between items-center">
            <span class="font-bold text-sm">${o.ticker} ${o.side} ${o.quantity} @ R$ ${o.price}</span>
            <span class="text-xs text-slate-500">${o.status}</span>
          </div>
        `).join('') : '<p class="text-slate-500 text-sm">Nenhuma ordem ainda.</p>';
      } catch (e) {
        document.getElementById('wallet-balance').textContent = 'R$ 0,00';
        document.getElementById('orders-list').innerHTML = '<p class="text-slate-500">Erro ao carregar.</p>';
      }
    }
    load();
  </script>
</body>
</html>
