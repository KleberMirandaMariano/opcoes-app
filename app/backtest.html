<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Backtesting de Estratégias - B3</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    /* ===== VARIÁVEIS DE COR ===== */
    :root {
      --color-primary: #10B981;
      --color-danger: #EF4444;
      --color-bg-dark: #0F172A;
      --color-card-dark: #1E293B;
      --color-surface-dark: #334155;
      --color-border: rgba(255, 255, 255, 0.1);
      --color-text-primary: #F1F5F9;
      --color-text-secondary: #CBD5E1;
    }

    * { box-sizing: border-box; }

    html.dark { background-color: var(--color-bg-dark); color-scheme: dark; }

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--color-bg-dark);
      background-image: radial-gradient(circle at 20% 50%, rgba(16, 185, 129, 0.05) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.03) 0%, transparent 50%);
      color: var(--color-text-primary);
      min-height: max(884px, 100dvh);
      line-height: 1.6;
    }

    .primary { color: var(--color-primary); }
    .bg-primary { background-color: var(--color-primary); }
    .border-primary { border-color: var(--color-primary); }
    .text-primary { color: var(--color-primary); }

    .danger { color: var(--color-danger); }
    .text-danger { color: var(--color-danger); }

    .bg-background-dark { background-color: var(--color-bg-dark); }
    .bg-card-dark { background-color: var(--color-card-dark); }
    .bg-surface-dark { background-color: var(--color-surface-dark); }

    .glassmorphism { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }

    .card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(16, 185, 129, 0.1); border-radius: 12px; transition: all 0.3s ease; }
    .card:hover { background: rgba(30, 41, 59, 0.8); border-color: rgba(16, 185, 129, 0.3); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(16, 185, 129, 0.1); }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .grid-line { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
    .data-line { stroke: var(--color-primary); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .text-slate-500 { color: var(--color-text-secondary); }
    .text-slate-400 { color: rgba(203, 213, 225, 0.7); }
    .text-slate-300 { color: rgba(203, 213, 225, 0.9); }
    .text-slate-100 { color: var(--color-text-primary); }

    .border-white/5 { border-color: rgba(255, 255, 255, 0.05); }
    .border-white/10 { border-color: rgba(255, 255, 255, 0.1); }

    .bg-white/5 { background-color: rgba(255, 255, 255, 0.05); }
    .bg-white/10 { background-color: rgba(255, 255, 255, 0.1); }

    .backdrop-blur-2xl { backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
    .backdrop-blur-xl { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  </style>
  <style> body { min-height: max(884px, 100dvh); } .no-scrollbar::-webkit-scrollbar { display: none; } </style>
</head>
<body class="bg-background-dark font-display text-white min-h-screen pb-24">
  <header class="sticky top-0 z-50 bg-background-dark/80 backdrop-blur-md border-b border-white/5">
    <div class="flex items-center p-4 justify-between max-w-md mx-auto">
      <a href="index.html" class="flex items-center gap-3"><span class="material-symbols-outlined cursor-pointer">arrow_back_ios</span><h1 class="text-lg font-bold tracking-tight">Backtesting</h1></a>
      <div class="flex items-center gap-2">
        <button class="p-2 hover:bg-white/10 rounded-full"><span class="material-symbols-outlined">tune</span></button>
        <button class="p-2 hover:bg-white/10 rounded-full"><span class="material-symbols-outlined">share</span></button>
      </div>
    </div>
    <div class="flex overflow-x-auto no-scrollbar px-4 gap-6 border-t border-white/5 max-w-md mx-auto">
      <button type="button" class="bt-tab flex flex-col items-center border-b-2 border-primary text-primary pb-3 pt-4 whitespace-nowrap text-xs font-bold uppercase tracking-wider" data-strategy="Venda Coberta">Venda Coberta</button>
      <button type="button" class="bt-tab flex flex-col items-center border-b-2 border-transparent text-slate-500 pb-3 pt-4 whitespace-nowrap text-xs font-bold uppercase tracking-wider" data-strategy="Iron Condor">Iron Condor</button>
      <button type="button" class="bt-tab flex flex-col items-center border-b-2 border-transparent text-slate-500 pb-3 pt-4 whitespace-nowrap text-xs font-bold uppercase tracking-wider" data-strategy="Trava de Alta">Trava de Alta</button>
      <button type="button" class="bt-tab flex flex-col items-center border-b-2 border-transparent text-slate-500 pb-3 pt-4 whitespace-nowrap text-xs font-bold uppercase tracking-wider" data-strategy="Straddle">Straddle</button>
    </div>
  </header>
  <main class="max-w-md mx-auto pb-24">
    <div class="px-4 py-4">
      <div class="flex h-11 items-center justify-center rounded-xl bg-white/5 p-1">
        <label class="flex cursor-pointer h-full grow items-center justify-center rounded-lg px-2 tf-btn text-slate-400 text-sm font-semibold has-[:checked]:bg-primary/20 has-[:checked]:text-primary" data-tf="6M"><span class="truncate">6 Meses</span><input class="sr-only" name="timeframe" type="radio" value="6M"/></label>
        <label class="flex cursor-pointer h-full grow items-center justify-center rounded-lg px-2 tf-btn text-slate-400 text-sm font-semibold has-[:checked]:bg-primary/20 has-[:checked]:text-primary" data-tf="2Y"><span class="truncate">2 Anos</span><input checked class="sr-only" name="timeframe" type="radio" value="2Y"/></label>
        <label class="flex cursor-pointer h-full grow items-center justify-center rounded-lg px-2 tf-btn text-slate-400 text-sm font-semibold has-[:checked]:bg-primary/20 has-[:checked]:text-primary" data-tf="Max"><span class="truncate">Máx</span><input class="sr-only" name="timeframe" type="radio" value="Max"/></label>
      </div>
    </div>
    <section class="px-4 py-2">
      <div id="hero-chart" class="bg-white/5 rounded-2xl p-5 border border-white/5">
        <div class="flex flex-col gap-1 mb-6">
          <div class="flex items-center justify-between">
            <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Patrimônio vs IBOV</p>
            <span id="bt-variacao" class="flex items-center gap-1 text-primary text-sm font-bold">--</span>
          </div>
          <div class="flex items-baseline gap-2">
            <h2 id="bt-patrimonio" class="text-3xl font-extrabold tracking-tight">--</h2>
            <span id="bt-periodo" class="text-slate-500 text-sm font-medium">--</span>
          </div>
        </div>
        <div class="relative h-[200px] w-full">
          <svg class="w-full h-full" preserveAspectRatio="none" viewBox="0 0 400 150" id="bt-svg"></svg>
        </div>
      </div>
    </section>
    <section class="grid grid-cols-2 gap-4 px-4 py-6">
      <div class="bg-white/5 p-4 rounded-xl border border-white/5">
        <div class="flex items-center gap-2 mb-2"><span class="material-symbols-outlined text-primary text-lg">check_circle</span><p class="text-slate-500 text-[10px] font-bold uppercase tracking-wider">Taxa de Acerto</p></div>
        <p id="metric-acerto" class="text-2xl font-bold tracking-tight">--</p>
      </div>
      <div class="bg-white/5 p-4 rounded-xl border border-white/5">
        <div class="flex items-center gap-2 mb-2"><span class="material-symbols-outlined text-primary text-lg">analytics</span><p class="text-slate-500 text-[10px] font-bold uppercase tracking-wider">Profit Factor</p></div>
        <p id="metric-pf" class="text-2xl font-bold tracking-tight">--</p>
      </div>
      <div class="bg-white/5 p-4 rounded-xl border border-white/5">
        <div class="flex items-center gap-2 mb-2"><span class="material-symbols-outlined text-red-500 text-lg">trending_down</span><p class="text-slate-500 text-[10px] font-bold uppercase tracking-wider">Max Drawdown</p></div>
        <p id="metric-dd" class="text-2xl font-bold tracking-tight text-red-400">--</p>
      </div>
      <div class="bg-white/5 p-4 rounded-xl border border-white/5">
        <div class="flex items-center gap-2 mb-2"><span class="material-symbols-outlined text-blue-400 text-lg">equalizer</span><p class="text-slate-500 text-[10px] font-bold uppercase tracking-wider">Índice Sharpe</p></div>
        <p id="metric-sharpe" class="text-2xl font-bold tracking-tight">--</p>
      </div>
    </section>
    <section class="px-4 py-2">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-sm font-bold uppercase tracking-widest text-slate-400">Operações Recentes</h3>
      </div>
      <div class="space-y-3" id="trades-list"></div>
    </section>
  </main>
  <footer class="fixed bottom-0 left-0 right-0 p-4 pb-8 bg-gradient-to-t from-background-dark via-background-dark to-transparent">
    <div class="max-w-md mx-auto">
      <button id="btn-run" class="w-full bg-primary text-background-dark font-extrabold text-base py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2">
        <span class="material-symbols-outlined">refresh</span> EXECUTAR NOVO BACKTEST
      </button>
    </div>
  </footer>
  <div id="nav-placeholder"></div>
  <script src="js/api.js"></script>

  </style>
</body>
</html>
