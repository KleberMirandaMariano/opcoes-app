<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detalhes da Ação</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    /* ===== VARIÁVEIS DE COR ===== */
    :root {
      --color-primary: #10B981;
      --color-danger: #EF4444;
      --color-bg-dark: #0F172A;
      --color-card-dark: #1E293B;
      --color-surface-dark: #334155;
      --color-border: rgba(255, 255, 255, 0.1);
      --color-text-primary: #F1F5F9;
      --color-text-secondary: #CBD5E1;
    }

    * { box-sizing: border-box; }

    html.dark { background-color: var(--color-bg-dark); color-scheme: dark; }

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--color-bg-dark);
      background-image: radial-gradient(circle at 20% 50%, rgba(16, 185, 129, 0.05) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.03) 0%, transparent 50%);
      color: var(--color-text-primary);
      min-height: max(884px, 100dvh);
      line-height: 1.6;
    }

    .primary { color: var(--color-primary); }
    .bg-primary { background-color: var(--color-primary); }
    .border-primary { border-color: var(--color-primary); }
    .text-primary { color: var(--color-primary); }

    .danger { color: var(--color-danger); }
    .text-danger { color: var(--color-danger); }

    .bg-background-dark { background-color: var(--color-bg-dark); }
    .bg-card-dark { background-color: var(--color-card-dark); }
    .bg-surface-dark { background-color: var(--color-surface-dark); }

    .glassmorphism { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }

    .card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(16, 185, 129, 0.1); border-radius: 12px; transition: all 0.3s ease; }
    .card:hover { background: rgba(30, 41, 59, 0.8); border-color: rgba(16, 185, 129, 0.3); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(16, 185, 129, 0.1); }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .grid-line { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
    .data-line { stroke: var(--color-primary); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .text-slate-500 { color: var(--color-text-secondary); }
    .text-slate-400 { color: rgba(203, 213, 225, 0.7); }
    .text-slate-300 { color: rgba(203, 213, 225, 0.9); }
    .text-slate-100 { color: var(--color-text-primary); }

    .border-white/5 { border-color: rgba(255, 255, 255, 0.05); }
    .border-white/10 { border-color: rgba(255, 255, 255, 0.1); }

    .bg-white/5 { background-color: rgba(255, 255, 255, 0.05); }
    .bg-white/10 { background-color: rgba(255, 255, 255, 0.1); }

    .backdrop-blur-2xl { backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
    .backdrop-blur-xl { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  </style>
  <style>
    body { font-family: 'Manrope', sans-serif; }
    .chart-gradient { background: linear-gradient(180deg, rgba(19, 236, 106, 0.15) 0%, rgba(19, 236, 106, 0) 100%); }
    body { min-height: max(884px, 100dvh); }
  </style>
</head>
<body class="bg-background-dark text-white min-h-screen flex flex-col font-display">
  <header class="sticky top-0 z-50 bg-background-dark/80 backdrop-blur-md border-b border-white/10">
    <div class="flex items-center justify-between p-4 max-w-md mx-auto w-full">
      <a href="ativos.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors">
        <span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
      </a>
      <div class="text-center">
        <h1 id="header-ticker" class="text-lg font-bold tracking-tight">--</h1>
        <p id="header-name" class="text-[10px] uppercase tracking-widest text-primary/70 font-bold">B3</p>
      </div>
      <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors">
        <span class="material-symbols-outlined text-2xl">star</span>
      </button>
    </div>
  </header>
  <main class="flex-1 w-full max-w-md mx-auto pb-32">
    <section class="p-6 pb-2">
      <div class="flex justify-between items-start mb-4">
        <div class="flex flex-col gap-1">
          <div id="logo-box" class="w-14 h-14 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center p-2 mb-2">
            <span class="material-symbols-outlined text-2xl text-slate-400">show_chart</span>
          </div>
          <h2 id="stock-name" class="text-2xl font-extrabold tracking-tight">--</h2>
          <p id="stock-short" class="text-slate-400 font-medium">--</p>
        </div>
        <div class="text-right">
          <p id="stock-price" class="text-3xl font-extrabold tracking-tighter">--</p>
          <div id="stock-change" class="flex items-center justify-end text-primary gap-1 font-bold">--</div>
        </div>
      </div>
    </section>
    <section class="px-6 py-4">
      <div class="flex bg-white/5 rounded-xl p-1 gap-1">
        <button class="flex-1 py-2 text-xs font-bold rounded-lg bg-primary text-background-dark shadow-sm">1D</button>
        <button class="flex-1 py-2 text-xs font-bold rounded-lg hover:bg-white/10 text-slate-400">5D</button>
        <button class="flex-1 py-2 text-xs font-bold rounded-lg hover:bg-white/10 text-slate-400">1M</button>
        <button class="flex-1 py-2 text-xs font-bold rounded-lg hover:bg-white/10 text-slate-400">6M</button>
        <button class="flex-1 py-2 text-xs font-bold rounded-lg hover:bg-white/10 text-slate-400">1Y</button>
        <button class="flex-1 py-2 text-xs font-bold rounded-lg hover:bg-white/10 text-slate-400">MAX</button>
      </div>
    </section>
    <section class="px-4 py-2 relative">
      <div class="w-full h-64 relative">
        <svg class="w-full h-full" viewBox="0 0 400 150" id="chart-svg"></svg>
      </div>
    </section>
    <section class="px-6 py-8">
      <h3 class="text-sm font-bold uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2">
        <span class="material-symbols-outlined text-lg">analytics</span> Indicadores Fundamentalistas
      </h3>
      <div class="grid grid-cols-2 gap-4" id="fundamentals-grid"></div>
    </section>
    <section class="px-6 py-4">
      <h3 class="text-sm font-bold uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2">
        <span class="material-symbols-outlined text-lg">info</span> Sobre a Companhia
      </h3>
      <div class="bg-white/5 border border-white/10 p-5 rounded-2xl leading-relaxed">
        <p id="about-text" class="text-sm text-slate-300 mb-3">Carregando...</p>
      </div>
    </section>
  </main>
  <footer class="fixed bottom-0 left-0 right-0 bg-background-dark/80 backdrop-blur-xl border-t border-white/10 p-6 z-50">
    <div class="max-w-md mx-auto flex gap-4">
      <button class="w-14 h-14 flex items-center justify-center border border-white/10 rounded-2xl hover:bg-white/5 transition-colors">
        <span class="material-symbols-outlined text-2xl">notifications</span>
      </button>
      <a id="btn-opcoes" href="#" class="flex-1 h-14 bg-primary text-background-dark font-extrabold rounded-2xl shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
        <span class="material-symbols-outlined font-bold">add_circle</span> VER GRADE DE OPCÕES
      </a>
    </div>
  </footer>
  <script src="js/api.js"></script>

</body>
</html>
