<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Boleta de Negociação</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "success": "#2ebd85",
                        "danger": "#f6465d",
                        "background-light": "#f6f7f8",
                        "background-dark": "#0b0e11",
                        "surface-dark": "#1e2329",
                        "border-dark": "#3b4754",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Custom radio logic for Buy/Sell colors */
        .buy-selected:checked + span { background-color: #137fec; color: white; }
        .sell-selected:checked + span { background-color: #f6465d; color: white; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white antialiased font-display">
<!-- Main Container (Mobile Viewport) -->
<div class="relative flex h-screen w-full flex-col overflow-hidden max-w-md mx-auto border-x border-border-dark/20">
<!-- Header -->
<header class="flex items-center justify-between px-4 py-4 bg-background-light dark:bg-background-dark border-b border-border-dark/10 dark:border-border-dark/30">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="text-lg font-bold tracking-tight">Boleta de Negociação</h1>
<button class="flex items-center justify-center size-10 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined">chart_spark</span>
</button>
</header>
<!-- Scrollable Content -->
<main class="flex-1 overflow-y-auto hide-scrollbar p-4 space-y-6 pb-32">
<!-- Asset Information Section -->
<section class="flex items-center justify-between bg-surface-dark/5 dark:bg-surface-dark p-4 rounded-xl border border-border-dark/10 dark:border-border-dark/30">
<div class="flex items-center gap-3">
<div class="size-12 rounded-lg bg-primary/10 flex items-center justify-center overflow-hidden">
<img alt="Petrobras Logo" data-alt="Petrobras company logo on blue background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDLZpTs6wYb3ksr0FALKweo1qIZvslN7IQE4f33NUKZOOfaZw0J-REwZqMYYWdA2gY3wFkaijCkBJZa7ll_FnispNI8qjTadpXPJ2uqTSGeg0TwLXVDmVstr9OjhOrHxJqzpt-SoNzmZ65f0Obx0H8lJb-00Fn53wdh0anwvAoqYycR02guubcnmBj5KnXTBmymA1cs4OaHktBPJeSrZlsN1rIzNSy8JJVVtBZ9nWupxLXkYY5XauoNAPJTvK9XeqafwS-k3SZIpB0N"/>
</div>
<div>
<h2 class="text-xl font-bold leading-none mb-1">PETR4</h2>
<p class="text-xs text-slate-500 dark:text-slate-400">PETRÓLEO BRASILEIRO S.A.</p>
</div>
</div>
<div class="text-right">
<p class="text-xl font-bold leading-none mb-1">R$ 34,50</p>
<p class="text-sm font-medium text-success">+1,24%</p>
</div>
</section>
<!-- Side Selector (Buy/Sell) -->
<div class="flex p-1 bg-surface-dark/10 dark:bg-surface-dark/50 rounded-xl border border-border-dark/10 dark:border-border-dark/30">
<label class="relative flex-1 cursor-pointer">
<input checked="" class="peer sr-only buy-selected" name="side" type="radio"/>
<span class="flex items-center justify-center h-11 rounded-lg text-sm font-bold transition-all duration-200 text-slate-500 dark:text-slate-400 peer-checked:bg-primary peer-checked:text-white">
                        COMPRA
                    </span>
</label>
<label class="relative flex-1 cursor-pointer">
<input class="peer sr-only sell-selected" name="side" type="radio"/>
<span class="flex items-center justify-center h-11 rounded-lg text-sm font-bold transition-all duration-200 text-slate-500 dark:text-slate-400 peer-checked:bg-danger peer-checked:text-white">
                        VENDA
                    </span>
</label>
</div>
<!-- Form Fields -->
<div class="space-y-4">
<!-- Order Type -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-300 ml-1">Tipo de Ordem</label>
<div class="relative">
<select class="w-full h-14 bg-white dark:bg-surface-dark border border-border-dark/20 dark:border-border-dark rounded-xl px-4 appearance-none focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all">
<option>Limitada</option>
<option>A Mercado</option>
<option>Stop Loss</option>
<option>Stop Móvel</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">expand_more</span>
</div>
</div>
<!-- Quantity -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-300 ml-1">Quantidade</label>
<div class="flex h-14 bg-white dark:bg-surface-dark border border-border-dark/20 dark:border-border-dark rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-primary/50 focus-within:border-primary transition-all">
<button class="w-14 flex items-center justify-center hover:bg-black/5 dark:hover:bg-white/5 active:scale-95 transition-transform">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="flex-1 bg-transparent border-none text-center font-bold text-lg focus:ring-0" type="number" value="100"/>
<button class="w-14 flex items-center justify-center hover:bg-black/5 dark:hover:bg-white/5 active:scale-95 transition-transform">
<span class="material-symbols-outlined">add</span>
</button>
</div>
<div class="flex gap-2 pt-1 overflow-x-auto hide-scrollbar">
<button class="px-3 py-1.5 rounded-lg bg-surface-dark/10 dark:bg-surface-dark text-xs font-semibold hover:bg-primary/20 transition-colors">100</button>
<button class="px-3 py-1.5 rounded-lg bg-surface-dark/10 dark:bg-surface-dark text-xs font-semibold hover:bg-primary/20 transition-colors">500</button>
<button class="px-3 py-1.5 rounded-lg bg-surface-dark/10 dark:bg-surface-dark text-xs font-semibold hover:bg-primary/20 transition-colors">1k</button>
<button class="px-3 py-1.5 rounded-lg bg-surface-dark/10 dark:bg-surface-dark text-xs font-semibold hover:bg-primary/20 transition-colors">MÁX</button>
</div>
</div>
<!-- Price -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-300 ml-1">Preço (R$)</label>
<div class="flex h-14 bg-white dark:bg-surface-dark border border-border-dark/20 dark:border-border-dark rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-primary/50 focus-within:border-primary transition-all">
<button class="w-14 flex items-center justify-center hover:bg-black/5 dark:hover:bg-white/5 active:scale-95 transition-transform">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="flex-1 bg-transparent border-none text-center font-bold text-lg focus:ring-0" type="text" value="34,50"/>
<button class="w-14 flex items-center justify-center hover:bg-black/5 dark:hover:bg-white/5 active:scale-95 transition-transform">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
</div>
<!-- Financial Summary -->
<div class="p-4 bg-primary/5 dark:bg-primary/10 rounded-xl border border-primary/20 space-y-3">
<div class="flex justify-between items-center text-sm">
<span class="text-slate-500 dark:text-slate-400">Saldo Disponível</span>
<span class="font-bold">R$ 12.450,00</span>
</div>
<div class="flex justify-between items-center text-sm">
<span class="text-slate-500 dark:text-slate-400">Corretagem Estimada</span>
<span class="font-bold text-success">Grátis</span>
</div>
<div class="pt-2 border-t border-primary/10 flex justify-between items-end">
<span class="text-sm font-semibold text-slate-500 dark:text-slate-400">Total da Ordem</span>
<span class="text-xl font-extrabold text-primary">R$ 3.450,00</span>
</div>
</div>
<!-- Strategy Options (Mini-toggles) -->
<div class="flex items-center gap-2 py-2">
<label class="flex items-center gap-2 cursor-pointer">
<div class="relative inline-flex items-center">
<input class="sr-only peer" type="checkbox"/>
<div class="w-10 h-6 bg-slate-300 dark:bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</div>
<span class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Day Trade</span>
</label>
</div>
</main>
<!-- Fixed Footer Action -->
<footer class="absolute bottom-0 left-0 right-0 p-4 pb-8 bg-background-light dark:bg-background-dark border-t border-border-dark/10 dark:border-border-dark/30 backdrop-blur-md bg-opacity-90">
<button class="w-full h-14 bg-primary hover:bg-primary/90 active:scale-[0.98] text-white font-bold text-lg rounded-xl shadow-lg shadow-primary/30 transition-all flex items-center justify-center gap-2">
<span>Revisar e Enviar</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-[10px] text-center text-slate-400 dark:text-slate-500 mt-3 px-4 leading-tight uppercase tracking-widest">
                Ao confirmar, você concorda com os termos de risco da B3
            </p>
</footer>
</div>
</body></html>
