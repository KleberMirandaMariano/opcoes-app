<!DOCTYPE html>
<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Boleta de Negociação</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "success": "#00c087",
                        "danger": "#f6465d",
                        "background-dark": "#0b0e11",
                        "surface-dark": "#181a20",
                        "surface-accent": "#2b2f36",
                        "border-dark": "#3b4754",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }.buy-selected:checked + span { 
            background-color: theme('colors.success'); 
            color: white; 
            box-shadow: 0 4px 14px 0 rgba(0, 192, 135, 0.3);
        }
        .sell-selected:checked + span { 
            background-color: theme('colors.danger'); 
            color: white;
            box-shadow: 0 4px 14px 0 rgba(246, 70, 93, 0.3);
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark text-white antialiased font-display">
<div class="relative flex h-screen w-full flex-col overflow-hidden max-w-md mx-auto border-x border-border-dark/30">
<header class="flex items-center justify-between px-4 py-4 bg-background-dark border-b border-border-dark/30">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="text-lg font-bold tracking-tight">Boleta de Negociação</h1>
<button class="flex items-center justify-center size-10 rounded-full hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-success">signal_cellular_alt</span>
</button>
</header>
<main class="flex-1 overflow-y-auto hide-scrollbar p-4 space-y-6 pb-40">
<section class="flex items-center justify-between bg-surface-dark p-4 rounded-2xl border border-border-dark/30 shadow-lg">
<div class="flex items-center gap-3">
<div class="size-12 rounded-xl bg-surface-accent flex items-center justify-center overflow-hidden border border-border-dark/20">
<img alt="Asset Logo" class="w-8 h-8 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDLZpTs6wYb3ksr0FALKweo1qIZvslN7IQE4f33NUKZOOfaZw0J-REwZqMYYWdA2gY3wFkaijCkBJZa7ll_FnispNI8qjTadpXPJ2uqTSGeg0TwLXVDmVstr9OjhOrHxJqzpt-SoNzmZ65f0Obx0H8lJb-00Fn53wdh0anwvAoqYycR02guubcnmBj5KnXTBmymA1cs4OaHktBPJeSrZlsN1rIzNSy8JJVVtBZ9nWupxLXkYY5XauoNAPJTvK9XeqafwS-k3SZIpB0N"/>
</div>
<div>
<h2 class="text-xl font-bold leading-none mb-1">PETR4</h2>
<p class="text-xs text-slate-400 font-medium">PETRÓLEO BRASILEIRO S.A.</p>
</div>
</div>
<div class="text-right">
<p class="text-xl font-bold leading-none mb-1">R$ 34,50</p>
<p class="text-sm font-bold text-success flex items-center justify-end gap-1">
<span class="material-symbols-outlined text-xs">arrow_upward</span>
                        1,24%
                    </p>
</div>
</section>
<div class="flex p-1 bg-surface-dark rounded-2xl border border-border-dark/30">
<label class="relative flex-1 cursor-pointer">
<input checked="" class="peer sr-only buy-selected" name="side" type="radio"/>
<span class="flex items-center justify-center h-12 rounded-xl text-sm font-extrabold transition-all duration-300 text-slate-500 uppercase tracking-widest">
                        COMPRA
                    </span>
</label>
<label class="relative flex-1 cursor-pointer">
<input class="peer sr-only sell-selected" name="side" type="radio"/>
<span class="flex items-center justify-center h-12 rounded-xl text-sm font-extrabold transition-all duration-300 text-slate-500 uppercase tracking-widest">
                        VENDA
                    </span>
</label>
</div>
<div class="space-y-5">
<div class="space-y-2">
<label class="text-xs font-bold text-slate-400 ml-1 uppercase tracking-wider">Tipo de Ordem</label>
<div class="relative">
<select class="w-full h-14 bg-surface-dark border border-border-dark/50 rounded-2xl px-4 appearance-none focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all text-white font-semibold">
<option>Limitada</option>
<option>A Mercado</option>
<option>Stop Loss</option>
<option>Stop Móvel</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">unfold_more</span>
</div>
</div>
<div class="space-y-2">
<label class="text-xs font-bold text-slate-400 ml-1 uppercase tracking-wider">Quantidade</label>
<div class="flex h-14 bg-surface-dark border border-border-dark/50 rounded-2xl overflow-hidden focus-within:ring-2 focus-within:ring-primary/50 focus-within:border-primary transition-all">
<button class="w-16 flex items-center justify-center hover:bg-white/10 active:bg-white/20 transition-colors border-r border-border-dark/30">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="flex-1 bg-transparent border-none text-center font-bold text-xl focus:ring-0 text-white" type="number" value="100"/>
<button class="w-16 flex items-center justify-center hover:bg-white/10 active:bg-white/20 transition-colors border-l border-border-dark/30">
<span class="material-symbols-outlined">add</span>
</button>
</div>
<div class="flex gap-2 pt-1 overflow-x-auto hide-scrollbar">
<button class="px-4 py-2 rounded-xl bg-surface-dark border border-border-dark/30 text-xs font-bold text-slate-300 hover:border-primary transition-colors">100</button>
<button class="px-4 py-2 rounded-xl bg-surface-dark border border-border-dark/30 text-xs font-bold text-slate-300 hover:border-primary transition-colors">500</button>
<button class="px-4 py-2 rounded-xl bg-surface-dark border border-border-dark/30 text-xs font-bold text-slate-300 hover:border-primary transition-colors">1k</button>
<button class="px-4 py-2 rounded-xl bg-surface-dark border border-border-dark/30 text-xs font-bold text-slate-300 hover:border-primary transition-colors">MÁX</button>
</div>
</div>
<div class="space-y-2">
<label class="text-xs font-bold text-slate-400 ml-1 uppercase tracking-wider">Preço (R$)</label>
<div class="flex h-14 bg-surface-dark border border-border-dark/50 rounded-2xl overflow-hidden focus-within:ring-2 focus-within:ring-primary/50 focus-within:border-primary transition-all">
<button class="w-16 flex items-center justify-center hover:bg-white/10 active:bg-white/20 transition-colors border-r border-border-dark/30">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="flex-1 bg-transparent border-none text-center font-bold text-xl focus:ring-0 text-white" type="text" value="34,50"/>
<button class="w-16 flex items-center justify-center hover:bg-white/10 active:bg-white/20 transition-colors border-l border-border-dark/30">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
</div>
<div class="p-5 bg-surface-dark rounded-2xl border border-border-dark/50 space-y-4">
<div class="flex justify-between items-center text-sm">
<span class="text-slate-400 font-medium">Saldo Disponível</span>
<span class="font-bold text-slate-200">R$ 12.450,00</span>
</div>
<div class="flex justify-between items-center text-sm">
<span class="text-slate-400 font-medium">Corretagem Estimada</span>
<span class="font-bold text-success bg-success/10 px-2 py-0.5 rounded text-xs">GRÁTIS</span>
</div>
<div class="pt-4 border-t border-border-dark/30 flex justify-between items-end">
<div class="flex flex-col">
<span class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">Total Estimado</span>
<span class="text-sm font-semibold text-slate-400">Valor da Ordem</span>
</div>
<span class="text-2xl font-black text-white">R$ 3.450,00</span>
</div>
</div>
<div class="flex items-center gap-3 py-2 px-1">
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative inline-flex items-center">
<input class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-accent rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-success"></div>
</div>
<span class="text-xs font-extrabold text-slate-400 group-hover:text-white transition-colors uppercase tracking-wider">Day Trade</span>
</label>
</div>
</main>
<footer class="absolute bottom-0 left-0 right-0 p-4 pb-10 bg-background-dark/80 border-t border-border-dark/50 backdrop-blur-xl">
<button class="w-full h-14 bg-success hover:brightness-110 active:scale-[0.98] text-white font-black text-lg rounded-2xl shadow-xl shadow-success/20 transition-all flex items-center justify-center gap-3">
<span>REVISAR E ENVIAR</span>
<span class="material-symbols-outlined font-bold">arrow_forward</span>
</button>
<p class="text-[10px] text-center text-slate-500 mt-4 px-6 leading-tight uppercase tracking-[0.15em] font-bold">
                Bolsa de Valores B3 • Transação Segura
            </p>
</footer>
</div>

</body></html>
